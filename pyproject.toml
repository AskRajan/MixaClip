[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mixaclip"
version = "1.0.0"
description = "Automated Gaming Highlights & 9:16 Vertical Shorts Pipeline"
authors = [{ name = "AskRajan" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "scenedetect[opencv]>=0.6.0",
    "yt-dlp>=2024.01.01",
    "indic-transliteration>=2.3.0"
]

[project.scripts]
mixaclip = "mixaclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
